# =============================================================================
# AzureLocalRanger — TRAILHEAD Test Config
# Mode     : as-built (post-deployment documentation package)
# Target   : iic-clus01 (4-node Dell AX-760)
# Used for : Operation TRAILHEAD v1.4.2 field validation — Scenario I
#
# Produces : Document Control block, Installation Register, Sign-Off table
#            in management and technical report tiers.
#
# WARNING : Never store plaintext secrets here.
#           All credentials use keyvault:// URI references.
# =============================================================================

environment:
  name: iic

targets:
  cluster:
    fqdn: iic-clus01.iic.local
    nodes:
      - iic-01-n01.iic.local
      - iic-01-n02.iic.local
      - iic-01-n03.iic.local
      - iic-01-n04.iic.local

  azure:
    subscriptionId: 00000000-0000-0000-0000-000000000000
    resourceGroup: rg-c01-azl-eus-01
    tenantId: 00000000-0000-0000-0000-000000000000

  bmc:
    endpoints:
      - host: 10.0.10.11
        node: iic-01-n01
      - host: 10.0.10.12
        node: iic-01-n02
      - host: 10.0.10.13
        node: iic-01-n03
      - host: 10.0.10.14
        node: iic-01-n04

credentials:
  azure:
    method: existing-context
    useAzureCliFallback: true

  cluster:
    username: IIC\svc.azl.local
    passwordRef: keyvault://kv-iic-platform/domain-admin-password

  domain:
    username: IIC\svc.azl.local
    passwordRef: keyvault://kv-iic-platform/domain-admin-password

  bmc:
    username: idrac_azl_admin
    passwordRef: keyvault://kv-iic-platform/idrac-password

domains:
  include: []
  exclude: []
  hints:
    fixtures: {}
    networkDeviceConfigs: []

output:
  mode: as-built
  formats:
    - html
    - markdown
    - json
    - xlsx
    - pdf
    - svg
    - drawio
  rootPath: C:\AzureLocalRanger\trailhead-as-built
  diagramFormat: svg
  keepRawEvidence: true

behavior:
  transport: auto
  degradationMode: graceful
  promptForMissingCredentials: false
  promptForMissingRequired: false
  skipUnavailableOptionalDomains: true
  failOnSchemaViolation: false
  logLevel: info
  retryCount: 2
  timeoutSeconds: 60
  continueToRendering: true
  showProgress: true
