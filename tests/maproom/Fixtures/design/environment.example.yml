    service_tag: ABC1235
  - name: azl-iic-n04
    management_ip: 10.0.0.14
    storage_ips: { smb1: 10.0.1.14, smb2: 10.0.2.14 }
    bmc_name: idrac-azl-iic-n04
    bmc_ip: 10.245.64.14
    service_tag: ABC1299
vlans:
