# Opens and maintains the release pull request from conventional commits (feat, fix, docs, infra ...).
# Merging that pull request creates the tag and the GitHub release, and the publish job below calls publish-gallery.yml in the
# same run (a release created with the GITHUB_TOKEN does not trigger other workflows on its own).
# The version in AzureLocalRanger.psd1 carries an x-release-please-version marker so release-please keeps it in step.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-gallery:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-gallery.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      dry-run: false
    secrets:
      PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
