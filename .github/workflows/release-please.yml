# Opens and maintains the release pull request from conventional commits (feat, fix, docs, infra ...).
# Merging that pull request creates the tag and the GitHub release; publish-gallery.yml then runs on the release.
# The version in AzureLocalRanger.psd1 carries an x-release-please-version marker so release-please keeps it in step.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
